  <circle cy="150" r="5" fill="#ffd21e"><animate attributeName="cx" values="560;602" dur="1.2s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cy="150" r="5" fill="#ffd21e"><animate attributeName="cx" values="844;886" dur="1.2s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>
